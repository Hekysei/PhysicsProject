<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Симуляция Кирхгофа</title>
    <link rel="stylesheet" th:href="@{/css/kirchhoff-style.css}">
</head>
<body class="login-body">

<div class="login-card">
    <h1 class="login-title">⚡ Регистрация</h1>
    <p class="login-subtitle">Создание аккаунта для проекта Kirchhoff</p>

    <div class="login-alert login-alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}">
        Ошибка регистрации.
    </div>

    <form class="login-form" th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="login-label" for="username">Имя пользователя</label>
        <input class="login-input" id="username" name="username" type="text" autocomplete="username"
               th:value="${username}" required autofocus>

        <label class="login-label" for="password">Пароль</label>
        <input class="login-input" id="password" name="password" type="password"
               autocomplete="new-password" required>

        <label class="login-label" for="confirmPassword">Повторите пароль</label>
        <input class="login-input" id="confirmPassword" name="confirmPassword" type="password"
               autocomplete="new-password" required>

        <button class="btn-calculate login-submit" type="submit">Зарегистрироваться</button>
    </form>

    <p class="login-switch">
        Уже есть аккаунт?
        <a th:href="@{/login}">Войти</a>
    </p>
</div>

</body>
</html>
